sonar.projectKey=Matheus-a31_teiu
sonar.organization=matheus-a31

# Código-fonte e testes
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Exclusões globais
sonar.exclusions=tests/fixtures/**,coverage/**,dist/**,project/**

# Não considerar testes e templates no cálculo de duplicação de código
sonar.cpd.exclusions=tests/**,**/*.test.ts,src/templates/**
